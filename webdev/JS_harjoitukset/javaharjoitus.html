<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="harjoitus.js" defer></script> <!--defer specifies that the script is downloaded in parallel to parsing the page, and executed after the page has finished parsing. This means that scripts are executed after all the HTML elements of the document are ready.-->

</head>

        "use strict";
        console.log("Tämä on inline esimerkki");
    </script>
    
</body>
</html>
